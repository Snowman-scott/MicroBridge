name: MicroBridge Multi-Version CI
on: [push, pull_request]

jobs:
  # 1. Cross-OS Matrix (Windows, Mac, Ubuntu)
  os-matrix-tests:
    name: ${{ matrix.os }} (Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        # Testing stable range 3.9 through 3.14
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Tests
        env:
          PYTHONPATH: "The_Source_Code"
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # 2. Linux Distribution Specific (Arch & Fedora)
  distro-tests:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ["archlinux:latest", "fedora:latest"]
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python (Arch)
        if: matrix.distro == 'archlinux:latest'
        run: pacman -Syu --noconfirm python python-pip
      - name: Install Python (Fedora)
        if: matrix.distro == 'fedora:latest'
        run: dnf install -y python3 python3-pip
      - name: Run Tests
        env:
          PYTHONPATH: "The_Source_Code"
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
