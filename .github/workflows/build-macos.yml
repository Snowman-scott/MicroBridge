name: Build macOS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          python3 --version
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .
          python3 -m pip install pyinstaller

          rm -rf build dist
          python3 -m PyInstaller \
            --name="MicroBridge" \
            --onedir \
            --windowed \
            --add-data="src/MicroBridge/resources/MicroBridge_Icon.ico:." \
            --distpath="dist" \
            --workpath="build" \
            --noconfirm \
            "src/MicroBridge/main.py"

          mkdir -p dist/bin
          cat > dist/bin/microbridge <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APP_DIR="$(cd "$(dirname "$0")/.." && pwd)/MicroBridge.app"
          exec "$APP_DIR/Contents/MacOS/MicroBridge" "$@"
          EOF
          chmod +x dist/bin/microbridge
      - name: Package app bundle
        run: |
          # ditto, not zip: preserves the bundle's symlinks and resource forks.
          ditto -c -k --sequesterRsrc --keepParent \
            dist/MicroBridge.app MicroBridge-macos-arm64.zip
          shasum -a 256 MicroBridge-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroBridge-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            MicroBridge-macos-arm64.zip --clobber
