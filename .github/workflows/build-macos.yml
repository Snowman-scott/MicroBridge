name: Build macOS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          python3 --version
          pip install -e .
          pip install pyinstaller
          chmod +x ./build-scripts/build_macos.sh
          ./build-scripts/build_macos.sh
      - name: Package app bundle
        run: |
          # ditto, not zip: preserves the bundle's symlinks and resource forks.
          ditto -c -k --sequesterRsrc --keepParent \
            dist/MicroBridge.app MicroBridge-macos-arm64.zip
          shasum -a 256 MicroBridge-macos-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroBridge-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            MicroBridge-macos-arm64.zip --clobber
