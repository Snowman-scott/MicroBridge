name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-python-versions:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          python3 --version
          pip install -e .
          pip install pytest
          pytest tests -v

  test-arch:
    name: Test Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pacman -Syu --noconfirm python3 python-pip
      - name: Create venv
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
      - name: Run tests
        run: |
          source .venv/bin/activate
          python3 --version
          pip install -e .
          pip install pytest
          pytest tests -v

  test-fedora:
    name: Test Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: dnf install -y python3 python3-pip
      - name: Run tests
        run: |
          python3 --version
          pip install -e .
          pip install pytest
          pytest tests -v

  test-macos:
    name: Test macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          python3 --version
          pip install -e .
          pip install pytest
          pytest tests -v
