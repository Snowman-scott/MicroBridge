name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: |
          python --version
          pip install -e .
          pip install pytest pyinstaller
          pytest tests -v
          .\build-scripts\build_windows.bat
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroBridge-windows
          path: dist/MicroBridge/
          if-no-files-found: error
          retention-days: 7