stages:
  - test
  - build

.test_template:
  script:
    - python3 --version
    - pip install -e .
    - pip install pytest
    - pytest tests -v

# Matrix for Python Versions 3.11 through 3.14
test-python-versions:
  extends: .test_template
  image: python:${PYTHON_VERSION}-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]

# Specific Linux Distros
test-arch:
  extends: .test_template
  image: archlinux:latest
  before_script:
    - pacman -Syu --noconfirm python3 python-pip
    - python3 -m venv .venv
    - source .venv/bin/activate

test-fedora:
  extends: .test_template
  image: fedora:latest
  before_script:
    - dnf install -y python3 python3-pip

typecheck:
  extends: .test_template
  image: python:3.12-slim
  script:
    - python3 --version
    - pip install -e .
    - pip install pytest basedpyright
    - basedpyright

coverage:
  stage: test
  image: python:3.12-slim
  script:
    - python3 --version
    - pip install -e ".[dev]"
    - pytest --cov=MicroBridge --cov-report=term-missing --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml


test-and-build-linux:
  stage: build
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: on_success
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends binutils
  script:
    - python3 --version
    - pip install -e .
    - pip install pyinstaller
    - chmod +x ./build-scripts/build_linux.sh
    - ./build-scripts/build_linux.sh
  artifacts:
    paths:
      - dist/MicroBridge/
    expire_in: 1 week

test-and-build-windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: on_success
  script:
    - python --version
    - pip install -e .
    - pip install pytest pyinstaller
    - pytest tests -v
    - .\build-scripts\build_windows.bat
  artifacts:
    paths:
      - dist/MicroBridge/
    expire_in: 1 week


